<template>
    <template lwc:if={loading}>
        <lightning-card title="SF IBA Report" icon-name="custom:custom53">
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </lightning-card>
    </template>
    <template lwc:elseif={error}>
        <lightning-card title="SF IBA Report" icon-name="custom:custom53">
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-horizontal_medium" role="alert">{error}</div>
        </lightning-card>
    </template>
    <template lwc:elseif={noAccount}>
        <lightning-card title="SF IBA Report" icon-name="custom:custom53">
            <p class="slds-p-horizontal_medium" data-id="no-account">
                Open SF IBA Report from an account, with the button "SF IBA Report" on the account page.
            </p>
        </lightning-card>
    </template>
    <template lwc:elseif={nothingDelivered}>
        <lightning-card title="SF IBA Report" icon-name="custom:custom53">
            <p class="slds-p-horizontal_medium" data-id="nothing-delivered">
                Salesforce has not yet delivered the data of this account. Start the delivery with the action
                "DIBA Report" of E+H on the account, then open this page again.
            </p>
        </lightning-card>
    </template>
    <template lwc:else>
        <c-sfiba-account account={account} onchanged={handleChanged}></c-sfiba-account>
    </template>
</template>
