<template>
    <template lwc:if={loading}>
        <lightning-card title="SF IBA Report" icon-name="custom:custom53">
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </lightning-card>
    </template>
    <template lwc:elseif={error}>
        <lightning-card title="SF IBA Report" icon-name="custom:custom53">
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-horizontal_medium" role="alert">{error}</div>
        </lightning-card>
    </template>
    <template lwc:elseif={noAccount}>
        <lightning-card title="SF IBA Report" icon-name="custom:custom53">
            <template lwc:if={hasAccounts}>
                <ul class="slds-has-dividers_bottom-space" data-id="accounts">
                    <template for:each={accounts} for:item="item">
                        <li key={item.key} class="slds-item">
                            <button class="slds-button slds-button_reset slds-size_1-of-1 slds-text-align_left" data-target={item.target} onclick={handleOpenAccount}>
                                <span class="slds-text-heading_small slds-text-link">{item.name}</span>
                                <span class="slds-text-body_small slds-text-color_weak slds-p-left_small">{item.delivered}</span>
                            </button>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else>
                <p class="slds-p-horizontal_medium" data-id="no-account">
                    No account data has been delivered yet. Start the delivery with the action "DIBA Report" of E+H on an account.
                </p>
            </template>
        </lightning-card>
    </template>
    <template lwc:elseif={nothingDelivered}>
        <lightning-card title="SF IBA Report" icon-name="custom:custom53">
            <p class="slds-p-horizontal_medium" data-id="nothing-delivered">
                Salesforce has not yet delivered the data of this account. Start the delivery with the action
                "DIBA Report" of E+H on the account, then open this page again.
            </p>
        </lightning-card>
    </template>
    <template lwc:else>
        <c-sfiba-account account={account} onchanged={handleChanged}></c-sfiba-account>
    </template>
</template>
