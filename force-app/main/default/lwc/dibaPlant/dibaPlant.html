<template>
    <lightning-card>
        <div slot="title" class="slds-grid slds-grid_vertical-align-center">
            <lightning-button-icon
                icon-name="utility:back"
                variant="bare"
                alternative-text="All plants"
                class="slds-m-right_small"
                onclick={handleBack}
            ></lightning-button-icon>
            <span class="slds-text-heading_medium">{title}</span>
            <span class="slds-text-color_weak slds-p-left_small">{rowCount}</span>
        </div>
        <div class="slds-p-horizontal_medium">
            <lightning-tabset>
                <template for:each={tabs} for:item="tab">
                    <lightning-tab key={tab.value} label={tab.label} value={tab.value}></lightning-tab>
                </template>
            </lightning-tabset>
            <lightning-button
                variant="brand"
                label="Edit assets"
                data-id="open-assets"
                icon-name="utility:table"
                class="slds-m-vertical_small"
                onclick={handleOpenAssets}
            ></lightning-button>
            <p class="slds-text-color_weak slds-m-bottom_medium">
                The contents of the tabs follow with the report texts.
            </p>
        </div>
    </lightning-card>
</template>
