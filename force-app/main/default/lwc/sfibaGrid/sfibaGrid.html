<template>
    <div class="sfiba-grid">
        <div class="sfiba-scroll" style={scrollStyle} onscroll={handleScroll}>
            <div class="sfiba-table" style={tableStyle} role="grid">
                <div class="sfiba-head" role="row">
                    <template for:each={headers} for:item="header">
                        <div key={header.field} class="sfiba-th" style={header.style} role="columnheader">
                            <button
                                class="sfiba-sort slds-truncate"
                                data-field={header.field}
                                title={header.sortLabel}
                                onclick={handleSort}
                            >
                                {header.label}
                                <template lwc:if={header.sortIcon}>
                                    <lightning-icon
                                        icon-name={header.sortIcon}
                                        size="xx-small"
                                        alternative-text={header.sortLabel}
                                    ></lightning-icon>
                                </template>
                            </button>
                            <template lwc:if={header.isSelect}>
                                <select
                                    class="sfiba-filter slds-select"
                                    data-field={header.field}
                                    aria-label="Filter"
                                    onchange={handleFilter}
                                >
                                    <option value="">All</option>
                                    <template for:each={header.filterOptions} for:item="option">
                                        <option key={option.value} value={option.value} selected={option.selected}>
                                            {option.label}
                                        </option>
                                    </template>
                                </select>
                            </template>
                            <template lwc:else>
                                <input
                                    class="sfiba-filter slds-input"
                                    data-field={header.field}
                                    value={header.filter}
                                    placeholder="Filter"
                                    aria-label="Filter"
                                    oninput={handleFilter}
                                />
                            </template>
                        </div>
                    </template>
                </div>
                <div style={topSpacerStyle}></div>
                <template for:each={visibleRows} for:item="row">
                    <div key={row.key} class={row.className} role="row" data-key={row.key}>
                        <template for:each={row.cells} for:item="cell">
                            <div
                                key={cell.id}
                                class={cell.className}
                                style={cell.style}
                                title={cell.title}
                                role="gridcell"
                                data-key={row.key}
                                data-field={cell.field}
                                data-editable={cell.editable}
                                onclick={handleCellClick}
                            >
                                <template lwc:if={cell.isCheckbox}>
                                    <input
                                        type="checkbox"
                                        checked={cell.checked}
                                        disabled={cell.disabled}
                                        data-key={row.key}
                                        data-field={cell.field}
                                        aria-label={cell.field}
                                        onchange={handleToggle}
                                    />
                                </template>
                                <template lwc:elseif={cell.isSelectEditor}>
                                    <select
                                        class="sfiba-editor slds-select"
                                        data-editor="true"
                                        onchange={handleEditorCommit}
                                        onblur={handleEditorCommit}
                                        onkeydown={handleEditorKey}
                                    >
                                        <template for:each={cell.options} for:item="option">
                                            <option key={option.value} value={option.value} selected={option.selected}>
                                                {option.label}
                                            </option>
                                        </template>
                                    </select>
                                </template>
                                <template lwc:elseif={cell.isInputEditor}>
                                    <input
                                        class="sfiba-editor slds-input"
                                        type={cell.inputType}
                                        value={cell.value}
                                        data-editor="true"
                                        onblur={handleEditorCommit}
                                        onkeydown={handleEditorKey}
                                    />
                                </template>
                                <template lwc:else>
                                    <span class="slds-truncate">{cell.display}</span>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
                <div style={bottomSpacerStyle}></div>
            </div>
            <template lwc:if={isEmpty}>
                <p class="sfiba-empty slds-p-around_medium">No rows.</p>
            </template>
        </div>
    </div>
</template>
