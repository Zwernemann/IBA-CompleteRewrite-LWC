<template>
    <article class="slds-box slds-box_x-small slds-m-vertical_small diba-attachment">
        <div class="slds-grid slds-grid_vertical-align-center">
            <lightning-icon icon-name={icon} size="small" class="slds-m-right_small"></lightning-icon>
            <div class="slds-col">
                <p class="slds-text-title_bold">{title}</p>
                <template lwc:if={hasFile}>
                    <a href={downloadUrl} target="_blank" data-id="download">{attachment.fileName}</a>
                    <span class="slds-text-color_weak slds-p-left_x-small">{details}</span>
                </template>
            </div>
            <div class="slds-col slds-grow-none">
                <template lwc:if={hasFile}>
                    <lightning-button label={removeLabel} variant="destructive-text" onclick={handleRemove} disabled={busy} data-id="remove"></lightning-button>
                </template>
                <template lwc:elseif={isLogo}>
                    <lightning-input type="file" label={uploadLabel} accept={accept} onchange={handleLogo} disabled={busy} data-id="logo"></lightning-input>
                </template>
                <template lwc:else>
                    <lightning-file-upload label={uploadLabel} record-id={plantId} accept={acceptList} onuploadfinished={handleUploadFinished} disabled={busy} data-id="pdf"></lightning-file-upload>
                </template>
            </div>
        </div>
        <template lwc:if={busy}>
            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
        </template>
        <template lwc:if={error}>
            <p class="slds-text-color_error slds-p-top_xx-small">{error}</p>
        </template>
    </article>
</template>
