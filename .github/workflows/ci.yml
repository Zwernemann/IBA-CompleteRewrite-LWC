name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      task:
        description: "Aufgabe"
        type: choice
        options: ["Installer bauen (Beta)", "Installer bauen und freigeben"]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A newer push makes the checks of an older one pointless; a package build is never
  # cut off, it may already have used a version from the daily quota of the Dev Hub.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type != 'tag' }}

env:
  SF_CLI_VERSION: "2.159.5"
  NODE_VERSION: "22"

jobs:
  checks:
    name: Pruefungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: LWC-Tests
        run: npm test
      - name: Apex-Syntax und Format
        run: npm run -s check:apex
      - name: Metadaten
        run: npm run -s check:metadata
      - name: Quellformat umwandelbar
        run: |
          npm install --global "@salesforce/cli@${SF_CLI_VERSION}"
          sf project convert source --source-dir force-app --output-dir "$RUNNER_TEMP/mdapi/force-app"
          sf project convert source --source-dir eh-emulation --output-dir "$RUNNER_TEMP/mdapi/eh-emulation"
      - name: Permission Sets aktuell
        run: node scripts/generate-permissionsets.mjs --check
      - name: Version erhoeht
        if: github.event_name == 'push'
        run: scripts/check-version.sh "${{ github.event.before }}"

  # Package versions count against the daily quota of the Dev Hub and take minutes; they
  # are built only on request (Run workflow) or for a tag, never for a plain push.
  package:
    name: Paket bauen
    needs: checks
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      SF_DEVHUB_USERNAME: ${{ secrets.SF_DEVHUB_USERNAME }}
      SF_DEVHUB_CLIENT_ID: ${{ secrets.SF_DEVHUB_CLIENT_ID }}
      SF_DEVHUB_JWT_KEY: ${{ secrets.SF_DEVHUB_JWT_KEY }}
      SF_TESTORG_USERNAME: ${{ secrets.SF_TESTORG_USERNAME }}
      # Without an app of its own the test org is reached through the app of the Dev Hub,
      # as when the Dev Hub is the test org: then only SF_TESTORG_USERNAME is needed.
      SF_TESTORG_CLIENT_ID: ${{ secrets.SF_TESTORG_CLIENT_ID || secrets.SF_DEVHUB_CLIENT_ID }}
      SF_TESTORG_JWT_KEY: ${{ secrets.SF_TESTORG_JWT_KEY || secrets.SF_DEVHUB_JWT_KEY }}
      SF_TESTORG_LOGIN_URL: ${{ secrets.SF_TESTORG_LOGIN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Salesforce CLI
        run: npm install --global "@salesforce/cli@${SF_CLI_VERSION}"
      - name: Anmeldung Dev Hub
        id: devhub
        run: |
          set +e
          scripts/ci-login.sh devhub
          code=$?
          if [ $code -eq 3 ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Paketversionen bauen
        id: build
        if: steps.devhub.outputs.ready == 'true'
        run: |
          promote=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ inputs.task }}" = "Installer bauen und freigeben" ]; then promote="--promote"; fi
          scripts/dependencies-resolve.sh
          VERSION_FILE=report.id scripts/package-version.sh "SF Frontend IBA" $promote
          VERSION_FILE=testdata.id scripts/package-version.sh "SF Frontend IBA Test Data" $promote
          echo "report=$(cat report.id)" >> "$GITHUB_OUTPUT"
          echo "testdata=$(cat testdata.id)" >> "$GITHUB_OUTPUT"
      - name: Upgrade in der Test-Org
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        run: |
          set +e
          scripts/ci-login.sh testorg
          code=$?
          if [ $code -eq 3 ]; then exit 0; fi
          [ $code -eq 0 ] || exit $code
          set -e
          scripts/org-install-test.sh testorg "${{ steps.build.outputs.report }}" "${{ steps.build.outputs.testdata }}"
          scripts/e2e.sh testorg
      - name: Erstinstallation in einer Scratch Org
        if: steps.build.outcome == 'success' && github.ref_type == 'tag'
        run: scripts/scratch-test.sh "${{ steps.build.outputs.report }}" "${{ steps.build.outputs.testdata }}"
      - name: Bericht der Ende-zu-Ende-Tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: target/e2e
          if-no-files-found: ignore
