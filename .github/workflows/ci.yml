name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      task:
        description: "Aufgabe"
        type: choice
        options: ["Pakete anlegen"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  SF_CLI_VERSION: "2.159.5"
  NODE_VERSION: "22"

jobs:
  checks:
    name: Pruefungen
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Apex-Syntax und Format
        run: npm run -s check:apex
      - name: Metadaten
        run: npm run -s check:metadata
      - name: Quellformat umwandelbar
        run: |
          npm install --global "@salesforce/cli@${SF_CLI_VERSION}"
          sf project convert source --source-dir force-app --output-dir "$RUNNER_TEMP/mdapi/force-app"
          sf project convert source --source-dir eh-emulation --output-dir "$RUNNER_TEMP/mdapi/eh-emulation"
      - name: Permission Sets aktuell
        run: node scripts/generate-permissionsets.mjs --check
      - name: Version erhoeht
        run: scripts/check-version.sh "${{ github.event.before }}"

  package:
    name: Paket bauen
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SF_DEVHUB_USERNAME: ${{ secrets.SF_DEVHUB_USERNAME }}
      SF_DEVHUB_CLIENT_ID: ${{ secrets.SF_DEVHUB_CLIENT_ID }}
      SF_DEVHUB_JWT_KEY: ${{ secrets.SF_DEVHUB_JWT_KEY }}
      SF_TESTORG_USERNAME: ${{ secrets.SF_TESTORG_USERNAME }}
      SF_TESTORG_CLIENT_ID: ${{ secrets.SF_TESTORG_CLIENT_ID }}
      SF_TESTORG_JWT_KEY: ${{ secrets.SF_TESTORG_JWT_KEY }}
      SF_TESTORG_LOGIN_URL: ${{ secrets.SF_TESTORG_LOGIN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Salesforce CLI
        run: npm install --global "@salesforce/cli@${SF_CLI_VERSION}"
      - name: Anmeldung Dev Hub
        id: devhub
        run: |
          set +e
          scripts/ci-login.sh devhub
          code=$?
          if [ $code -eq 3 ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Paketversionen bauen
        id: build
        if: steps.devhub.outputs.ready == 'true'
        run: |
          promote=""
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then promote="--promote"; fi
          VERSION_FILE=report.id scripts/package-version.sh "DIBA Report" $promote
          VERSION_FILE=testdata.id scripts/package-version.sh "DIBA Test Data" $promote
          echo "report=$(cat report.id)" >> "$GITHUB_OUTPUT"
          echo "testdata=$(cat testdata.id)" >> "$GITHUB_OUTPUT"
      - name: Upgrade in der Test-Org
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        run: |
          set +e
          scripts/ci-login.sh testorg
          code=$?
          if [ $code -eq 3 ]; then exit 0; fi
          [ $code -eq 0 ] || exit $code
          set -e
          scripts/org-install-test.sh testorg "${{ steps.build.outputs.report }}" "${{ steps.build.outputs.testdata }}"
      - name: Erstinstallation in einer Scratch Org
        if: steps.build.outcome == 'success' && github.ref_type == 'tag'
        run: scripts/scratch-test.sh "${{ steps.build.outputs.report }}" "${{ steps.build.outputs.testdata }}"

  create-packages:
    name: Pakete anlegen
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'Pakete anlegen'
    runs-on: ubuntu-latest
    env:
      SF_DEVHUB_USERNAME: ${{ secrets.SF_DEVHUB_USERNAME }}
      SF_DEVHUB_CLIENT_ID: ${{ secrets.SF_DEVHUB_CLIENT_ID }}
      SF_DEVHUB_JWT_KEY: ${{ secrets.SF_DEVHUB_JWT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "@salesforce/cli@${SF_CLI_VERSION}"
      - run: scripts/ci-login.sh devhub
      - run: scripts/packages-create.sh
